[package]
name = "r-consumer"
version = "0.1.0"
edition = "2024"

[dependencies]
r-config = { version = "0.1.0", path = "../r-config" }
r-setting = { version = "0.1.0", path = "../r-setting" }
r-process = { version = "0.1.0", path = "../r-process" }
r-error = { version = "0.1.0", path = "../r-error" }
value-rs = { workspace = true }

anyhow = { workspace = true }
axum = "0.8.8"
futures = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt"] }
tracing = { workspace = true }

[dev-dependencies]
async-trait = "0.1.83"
sonic-rs = { workspace = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rdkafka = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
rdkafka = { workspace = true, features = ["dynamic-linking"] }
